{% extends "base.html" %}
{% load static %}
{% load my_tags %}

{% block title %}User Page😊{% endblock title %}
{% block content %}
<article>
    {% for i in video %}
    <div class="video-player">
        <video autoplay muted controls loop="loop" id='video' src="{{i.video_url}}">
        </video>
    </div>
    <div class='like_part'>
        Like: {{like|get:forloop.counter0}}
    </div>
    {%endfor%}
</article>
{% endblock content %}
